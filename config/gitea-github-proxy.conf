# Nginx config for GitHub-Enterprise-compatible proxy in front of Gitea.
# che-server expects GitHub API v3 and raw URL format; Gitea uses v1 and a different raw path.
# This proxy maps GitHub-style endpoints to Gitea equivalents.
#
# Port: 4000

events {}
http {
    server {
        listen 4000;
        listen [::]:4000;

        # GitHub Enterprise raw URL: /raw/<user>/<repo>/<ref>/<file>
        # Gitea web raw URL:         /<user>/<repo>/raw/branch/<ref>/<file>
        location ~ ^/raw/([^/]+)/([^/]+)/([^/]+)/(.+)$ {
            proxy_pass http://gitea-ipv6:3000/$1/$2/raw/branch/$3/$4;
            proxy_set_header Host $host;
        }

        # GitHub API v3 is NOT proxied - returns 404 so AbstractGithubURLParser
        # falls into ScmItemNotFoundException → isGiteaCompatibleServer() check.
        location /api/v3/ {
            return 404;
        }

        # Gitea API v1 is proxied through for isGiteaCompatibleServer() to get 401.
        location /api/v1/ {
            proxy_pass http://gitea-ipv6:3000;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://gitea-ipv6:3000;
            proxy_set_header Host $host;
        }
    }
}
